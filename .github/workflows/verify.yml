name: Verify
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run format:check && npm run build
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [h2, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nexadvisor_test
          POSTGRES_USER: nexadvisor
          POSTGRES_PASSWORD: ci_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexadvisor -d nexadvisor_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - if: matrix.database == 'h2'
        working-directory: backend
        run: bash mvnw -B verify
      - if: matrix.database == 'postgres'
        working-directory: backend
        run: bash mvnw -B verify -Dspring.datasource.url=jdbc:postgresql://localhost:5432/nexadvisor_test -Dspring.datasource.username=nexadvisor -Dspring.datasource.password=ci_test_only
