spring.application.name=nexadvisor-api
server.port=${PORT:8081}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nexadvisor}
spring.datasource.username=${DATABASE_USER:nexadvisor}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=NEXADVISOR_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
server.error.include-message=never
nexadvisor.payments.simulation-enabled=${PAYMENT_SIMULATION_ENABLED:false}
nexadvisor.bootstrap.email=${ADMIN_EMAIL:}
nexadvisor.bootstrap.password=${ADMIN_PASSWORD:}

nexadvisor.public-origin=${PUBLIC_ORIGIN:http://localhost:3000}
nexadvisor.mail.mode=${MAIL_MODE:DISABLED}
nexadvisor.mail.from=${MAIL_FROM:noreply@example.test}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
